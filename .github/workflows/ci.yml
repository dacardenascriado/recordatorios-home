name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      # Que un reminders.yaml roto no llegue nunca a main. Acá no hay secretos
      # reales (y en un PR desde un fork nunca los habría), así que el chat_id
      # y los nombres se resuelven con relleno: lo que se valida es la
      # estructura y los horarios, no los datos.
      # (Sin anclas YAML: el parser de GitHub Actions no las soporta.)
      - name: Validar reminders.yaml
        env:
          TELEGRAM_CHAT_ID: "0"
          PERSONA_1: "Persona-1"
          PERSONA_2: "Persona-2"
          PERSONA_3: "Persona-3"
          PERSONA_4: "Persona-4"
        run: python -m recordatorios validate

      - name: Agenda de las próximas 4 semanas
        env:
          TELEGRAM_CHAT_ID: "0"
          PERSONA_1: "Persona-1"
          PERSONA_2: "Persona-2"
          PERSONA_3: "Persona-3"
          PERSONA_4: "Persona-4"
        run: python -m recordatorios agenda --days 28
