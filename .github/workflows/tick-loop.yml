name: tick-loop

# El reloj de verdad.
#
# `tick.yml` pide a Actions 288 arranques por día (cron `*/5`). Actions no los
# honra: en agosto de 2026 la tasa real cayó de ~45 corridas diarias a 3, con
# huecos de 10 horas, y los recordatorios que caían en esos huecos no salían.
# Todas las corridas terminaban en verde — el problema nunca fue el código,
# era que GitHub descarta corridas `schedule`, y castiga sobre todo los crons
# de alta frecuencia en repos sin actividad reciente.
#
# La salida es dejar de depender de que Actions arranque seguido: este workflow
# pide 4 arranques al día en vez de 288, y el intervalo de 5 minutos lo pone un
# bucle dentro del propio job. Un arranque atrasado media hora ya no pierde
# nada; solo desplaza el comienzo de su bloque.
#
# `tick.yml` se queda como red de respaldo: si un bloque de estos no arranca,
# alguna corrida suelta del `*/5` puede tapar el hueco. Que los dos coincidan
# no duplica mensajes — `store.claim()` es un upsert atómico y solo una corrida
# se queda con cada ocurrencia.
on:
  schedule:
    # Cada 6 horas. El minuto 3 evita la hora en punto, que es cuando más se
    # congestiona la cola de Actions.
    - cron: "3 0,6,12,18 * * *"
  workflow_dispatch:

# Un bloque a la vez. Si el anterior todavía no terminó, el nuevo espera en vez
# de solaparse.
concurrency:
  group: tick-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    # El tope duro de un job son 6 h. 5h50 deja margen para el checkout, el
    # pip install y el último tick antes de que Actions lo corte.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[postgres]"

      - name: Latir cada 5 minutos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PERSONA_1: ${{ secrets.PERSONA_1 }}
          PERSONA_2: ${{ secrets.PERSONA_2 }}
          PERSONA_3: ${{ secrets.PERSONA_3 }}
          PERSONA_4: ${{ secrets.PERSONA_4 }}
        run: |
          INTERVALO=300
          # 5h45 de bucle, dentro del timeout de 5h50 del job.
          DURACION=$(( 345 * 60 ))
          inicio=$(date +%s)
          vuelta=0

          while :; do
            vuelta=$(( vuelta + 1 ))
            echo "::group::tick #${vuelta}"
            # Un tick con envíos fallidos devuelve 1. Es justo el caso en que
            # hay que seguir latiendo: el próximo reintenta. Sin el `|| true`,
            # el `bash -e` de Actions cortaría el bloque entero.
            python -m recordatorios tick || echo "::warning::el tick devolvió error, sigo latiendo"
            echo "::endgroup::"

            restante=$(( DURACION - ( $(date +%s) - inicio ) ))
            if [ "$restante" -le "$INTERVALO" ]; then
              echo "Bloque terminado tras ${vuelta} ticks. El próximo arranca por cron."
              break
            fi
            sleep "$INTERVALO"
          done
