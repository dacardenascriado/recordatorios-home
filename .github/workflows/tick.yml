name: tick

# Red de respaldo del reloj, y la consola de mando a mano.
#
# El reloj principal es `tick-loop.yml`: Actions no honra este cron `*/5` —
# descarta la mayoría de las corridas y llegó a dejar huecos de 10 horas—, así
# que depender de él para la puntualidad no funciona. Se queda igual porque las
# corridas sueltas que sí arrancan pueden tapar un bloque de tick-loop que no
# haya arrancado, y porque este es el workflow con el desplegable de acciones
# (check, dry-run, history, send-test) para operar el sistema a mano.
#
# Que este y tick-loop coincidan no duplica mensajes: `store.claim()` es un
# upsert atómico y solo una corrida se queda con cada ocurrencia.
#
# En cualquier caso el tick trabaja por ventanas: recupera lo que se haya
# vencido desde la corrida anterior en vez de mirar solo el instante actual.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué ejecutar"
        type: choice
        default: check
        options:
          - check # revisa YAML, token, chats y base de datos. No envía nada
          - dry-run # muestra qué se enviaría ahora mismo. No envía nada
          - history # últimos envíos registrados, para saber qué pasó de verdad
          - tick # la corrida normal
          - send-test # envía un recordatorio ya, para probar de punta a punta
          - descartar # da por perdida una ocurrencia y la saca del dashboard
      send_test_id:
        description: "Solo para send-test: id del recordatorio (ej. basura-lun-mie-manana)"
        type: string
        default: ""
      descartar_ref:
        description: "Solo para descartar: la referencia que copia el dashboard (id@fecha-hora)"
        type: string
        default: ""

# Nunca dos ticks a la vez: evita reintentos solapados sobre la misma ventana.
concurrency:
  group: tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[postgres]"

      - name: Ejecutar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Los nombres no se publican en reminders.yaml. Al venir de secrets,
          # GitHub también los enmascara en el log de esta corrida.
          PERSONA_1: ${{ secrets.PERSONA_1 }}
          PERSONA_2: ${{ secrets.PERSONA_2 }}
          PERSONA_3: ${{ secrets.PERSONA_3 }}
          PERSONA_4: ${{ secrets.PERSONA_4 }}
          # Por env y no interpoladas en el script: un ${{ }} suelto dentro de
          # bash es una vía de inyección.
          ACCION: ${{ inputs.accion }}
          SEND_TEST_ID: ${{ inputs.send_test_id }}
          DESCARTAR_REF: ${{ inputs.descartar_ref }}
          # Ventana angosta a propósito, distinta de la de tick-loop (12 h).
          # Cada corrida de acá estrena runner, así que arranca sin el caché
          # local que le ahorra consultas a la base: con la ventana ancha,
          # cada una despertaría a Neon para reconfirmar hasta 12 h de
          # ocurrencias ya resueltas. Registrar las pérdidas largas es tarea
          # del bloque de tick-loop, que sí conserva el caché.
          TICK_LOOKBACK_MINUTES: "240"
        run: |
          # En las corridas por cron no hay inputs: ahí siempre es un tick.
          case "${ACCION:-tick}" in
            check)     python -m recordatorios check ;;
            dry-run)   python -m recordatorios tick --dry-run ;;
            history)   python -m recordatorios history --limit 50 ;;
            send-test)
              if [ -z "$SEND_TEST_ID" ]; then
                echo "Falta 'send_test_id': poné el id del recordatorio a probar." >&2
                exit 1
              fi
              python -m recordatorios send-test --id "$SEND_TEST_ID"
              ;;
            descartar)
              if [ -z "$DESCARTAR_REF" ]; then
                echo "Falta 'descartar_ref': copiala del dashboard." >&2
                exit 1
              fi
              python -m recordatorios descartar --ref "$DESCARTAR_REF"
              ;;
            *)         python -m recordatorios tick ;;
          esac
